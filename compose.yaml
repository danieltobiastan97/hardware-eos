services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hardware-eos-web
    ports:
      - "3000:5000"
    environment:
      PORT: "5000"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-this-secret-key}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-changeme}
    volumes:
      - .:/app:rw
      - /app/__pycache__
      - /app/.pytest_cache
    restart: unless-stopped
