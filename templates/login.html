<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Asset Lifecycle Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
  <div class="beta-banner">⚠️ Beta — AI-generated results may not be accurate. Please validate before use.</div>
  <main class="login-shell">
    <p class="eyebrow">// Secure Access</p>
    <h1>Asset Intelligence<br/><em>Login</em></h1>
    <p class="subtitle">Sign in with the built-in demo account to use the asset lifecycle tracker.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form class="login-form" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn-login" type="submit">Log In</button>
    </form>
  </main>
</body>
</html>
