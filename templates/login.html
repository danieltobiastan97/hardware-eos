<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Asset Lifecycle Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --surface: #141414;
      --border: #2a2a2a;
      --accent: #c8f04a;
      --accent-dim: #9ab835;
      --text: #e8e8e0;
      --muted: #5a5a52;
      --danger: #ff5c38;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4.6rem 2rem 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }
    .beta-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      padding: 0.62rem 1rem;
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      background: rgba(255, 149, 0, 0.95);
      color: #000000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(4px);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }
    .login-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      padding: 2rem;
      background: linear-gradient(160deg, rgba(200, 240, 74, 0.06), rgba(20, 20, 20, 0.96));
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.7rem;
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: 2.1rem;
      line-height: 1.05;
      margin-bottom: 0.75rem;
    }
    h1 em { font-style: italic; color: var(--accent); }
    .subtitle {
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
      margin-bottom: 1.4rem;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    label {
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 0.8rem 0.9rem;
      background: rgba(13, 13, 13, 0.9);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn-login {
      margin-top: 0.35rem;
      padding: 0.8rem 1rem;
      background: var(--accent);
      color: #0d0d0d;
      border: 1px solid var(--accent);
      border-radius: 4px;
      font: inherit;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-login:hover {
      background: var(--accent-dim);
      border-color: var(--accent-dim);
    }
    .error {
      margin-bottom: 1rem;
      padding: 0.8rem 0.9rem;
      border: 1px solid rgba(255, 92, 56, 0.3);
      border-radius: 4px;
      color: var(--danger);
      background: rgba(255, 92, 56, 0.08);
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <div class="beta-banner">⚠️ Beta — AI-generated results may not be accurate. Please validate before use.</div>
  <main class="login-shell">
    <p class="eyebrow">// Secure Access</p>
    <h1>Asset Intelligence<br/><em>Login</em></h1>
    <p class="subtitle">Sign in with the built-in demo account to use the asset lifecycle tracker.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form class="login-form" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn-login" type="submit">Log In</button>
    </form>
  </main>
</body>
</html>
